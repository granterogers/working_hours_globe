name: Webcams list update

# Saves the most popular webcams per country from the Windy Webcams API to data/webcams.json for the
# globe's Webcams layer. Needs the repository secret WINDY_WEBCAMS_KEY. Runs every Monday, or on demand.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webcams-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch webcams
        env:
          WINDY_WEBCAMS_KEY: ${{ secrets.WINDY_WEBCAMS_KEY }}
        run: python scripts/webcams.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/webcams.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Webcams layer: weekly list update"
          git pull --rebase
          git push

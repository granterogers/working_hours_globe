<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Interactive globe showing what your UK working hours would be in every country, state and province.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Working hours globe</title>
<meta property="og:title" content="Working hours globe">
<meta property="og:description" content="See what your UK working hours would be in every country, state and province.">
<meta property="og:url" content="https://granterogers.github.io/working_hours_globe/">
<link rel="canonical" href="https://granterogers.github.io/working_hours_globe/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://commons.wikimedia.org" crossorigin>
<link rel="preconnect" href="https://api.panoramax.xyz" crossorigin>
<link rel="preconnect" href="https://api.openstreetcam.org" crossorigin>
<link rel="preconnect" href="https://api.inaturalist.org" crossorigin>
<link rel="preconnect" href="https://query.wikidata.org" crossorigin>
<link rel="stylesheet" href="assets/style.css?v=202610282203">

</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="c" tabindex="0" aria-label="Globe of local working hours. Drag to spin, scroll to zoom, arrow keys to rotate, plus and minus to zoom."></canvas>

<section class="panel glass collapsed" id="panel">
  <button class="ph" id="ph" aria-expanded="false" aria-controls="pb">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span class="t"><b>Your working hours</b><span id="sum">12:00–20:00 UK, winter</span></span>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div class="pb" id="pb"><div><div class="pin">
    <div class="sec"><h3>Your shift in UK time</h3>
      <div class="shift"><input type="time" id="s" value="12:00" aria-label="Start time, UK"><span>to</span><input type="time" id="e" value="20:00" aria-label="End time, UK"></div></div>
    <div class="sec"><h3>Season</h3>
      <div class="seg" role="group" aria-label="Season"><button id="w" aria-pressed="true">Winter</button><button id="su" aria-pressed="false">Summer</button></div>
      <p class="note" id="snote"></p></div>
  </div></div></div>
</section>

<input type="file" id="file" accept=".kml,.kmz,.geojson,.json" multiple hidden>
<aside class="bandkey glass" id="bandkey" hidden aria-label="What the working-hours colours mean"><h4>Working hours</h4><ul id="bandlist"></ul></aside>
<div class="search glass" id="search" role="search">
    <span class="ic" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
    <input id="q" type="search" placeholder="Search a country, state or island" aria-label="Search places" autocomplete="off">
    <ul class="res glass" id="res" role="listbox"></ul>
  </div>
<div class="tools">
  <div class="bmwrap">
    <button class="round glass" id="bmbtn" aria-label="Map layers" aria-haspopup="true" aria-expanded="false" title="Map layers"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/></svg></button>
    <div class="bmmenu glass" id="bmmenu" hidden role="menu" aria-label="Base map"></div>
  </div>
  <button class="round glass" id="b3d" aria-label="3D view" title="3D view"><b>3D</b></button>
<button class="round glass northbtn" id="north" aria-label="Point north" title="Point north (click again to look straight down)"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l4 9.5h-8z" fill="#e2453c"/><path d="M12 21.5l-4-9.5h8z" fill="currentColor" opacity=".55"/><text x="12" y="10.2" text-anchor="middle" font-size="5.2" font-weight="700" fill="#fff" font-family="sans-serif">N</text></svg></button>
  <button class="round glass locbtn" id="loc" aria-label="Go to my location" title="Go to my location"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
  <button class="round glass" id="fs" aria-label="Full screen"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div class="strip glass" id="strip" aria-hidden="true"></div>
<div class="attrib" id="attrib"></div>
<section class="lyr glass" id="lyr" aria-label="Layers"><button type="button" class="lyrh" id="lyrh" aria-expanded="true" aria-controls="lyrb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/></svg><span>Layers</span><i class="phchev" aria-hidden="true">›</i></button><div class="lyrb" id="lyrb"></div></section>
<div class="ptoast glass" id="ptoast" hidden>Click the map to drop a pin <button id="pcancel">Cancel</button></div>
<aside class="info glass" id="info" aria-live="polite"><button class="x" id="infox" aria-label="Close details">×</button><div id="infob"></div></aside>
<div class="toast glass" id="toast">Drag to spin, scroll or pinch to zoom, click a place for details</div>
<div class="ver" id="ver" aria-label="Version 1.26">v1.26</div>

<div class="loading" id="loading" role="status">Loading the map…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="assets/app.js?v=202610282203"></script>
</body>
</html>
